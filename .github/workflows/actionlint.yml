# Workflow for scanning GitHub workflows with actionlint
name: actionlint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # needed to annotate the files in a pull request with comments
      pull-requests: write
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-actionlint@4485daa4781dde13e7d9d5f4d8acbe33f993299c # v1.7.0
