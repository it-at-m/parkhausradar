[project]
name = "parkhausradar-collector"
version = "0.1.0"
description = "Writes the occupancy of the Munich parking garages to the FROST-Server"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.8",
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E701"] # line too long, multiple statements on one line

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
pythonpath = ["."]
testpaths = ["tests"]
